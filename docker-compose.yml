# "Alohida" rejim: server faqat shu do'kon uchun — bot + o'z Caddy si (80/443, avtomatik SSL).
# Serverda boshqa bot allaqachon 443-portda bo'lsa, docker-compose.shared.yml ishlatiladi (install.sh o'zi tanlaydi).
services:
  shop:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=8080
    volumes:
      - ./data:/app/data            # baza, rasmlar — konteyner qayta qurilsa ham saqlanadi
    expose:
      - "8080"
    mem_limit: 400m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:                            # HTTPS (Mini App uchun majburiy)
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - shop

volumes:
  caddy_data:
  caddy_config:
